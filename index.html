<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SAO Utils 2</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
#wrap{position:absolute;left:0;top:0;width:1152px;height:720px;transform-origin:0 0;overflow:hidden;background:#000}
#wrap>*{position:absolute}
.abs{position:absolute}
#bg{left:0;top:0;width:1152px;height:720px;will-change:filter,transform}
#rays,#fin,#wave,#rings{left:0;top:0;width:1152px;height:720px;pointer-events:none}
#hud,#menu{left:0;top:0;width:1152px;height:720px}
.plate{background:linear-gradient(#6c8498,#506a80);border:1px solid #9bb3c4;box-shadow:0 0 0 1px #2b3e50 inset}
.bar{background:#2d3d4b;border:1px solid #1d2a35}
.fill{height:100%}
.num{font-family:"Bahnschrift","Arial Narrow",Arial,sans-serif;color:#e9f2f7;letter-spacing:.5px}
.hex{width:40px;height:44px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;box-sizing:border-box}
.hexw{position:absolute;width:40px;height:44px;margin:-22px 0 0 -20px;filter:drop-shadow(0 0 3px rgba(0,30,50,.7))}
.hexw>i{position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#1b3a4a}
.hexw>b{position:absolute;inset:3px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:400}
.hexm{position:absolute;width:36px;height:40px;margin:-20px 0 0 -18px}
.hexm>i{position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#7fe3f2}
.hexm>b{position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(10,40,60,.55);display:flex;align-items:center;justify-content:center;font-size:14px;color:#dff;font-weight:400}
.thumb{position:absolute;overflow:hidden}
.thumb img{width:100%;height:100%;display:block;object-fit:fill}
.sch{position:absolute;left:0;width:128px;height:13px;background:rgba(14,38,64,.92);color:#cfe3f3;font-size:8.5px;line-height:13px;white-space:nowrap;overflow:hidden;border-bottom:1px solid rgba(80,120,160,.25)}
.sch b{display:inline-block;width:28px;text-align:center;font-weight:400;background:rgba(32,60,92,.9);color:#e8f2fa;margin-right:4px;font-family:Bahnschrift,Arial,sans-serif}
.sch.hl{background:#2d7fd8}.sch.rd{background:#d9505a}.sch.hd{background:#d9505a;color:#fff}
.circ{position:absolute;border-radius:50%;margin:-14px 0 0 -14px;width:28px;height:28px;background:radial-gradient(circle at 50% 35%,#cfd7e0,#9aa7b5);border:2px solid rgba(255,255,255,.7);box-sizing:border-box;opacity:.75;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.circ.on{background:radial-gradient(circle at 50% 30%,#ffd45c,#e0971a);border-color:#fff;opacity:1;box-shadow:0 0 6px rgba(255,190,60,.8)}
.mi{position:absolute;left:0;height:24px;background:#f4f4f2;color:#444;font-size:9.5px;line-height:24px;box-sizing:border-box;border-bottom:1px solid #d5d5d0;white-space:nowrap;overflow:hidden}
.mi.on{background:linear-gradient(#f7b92e,#e6a014);color:#fff}
.mi i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#555;margin:0 5px -2px 6px;vertical-align:baseline}
.mi.on i{background:#fff}
.mi.dk{background:#cfcfcf;color:#666}
#cursor{width:16px;height:22px;pointer-events:none;z-index:50}
#start{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-family:Bahnschrift,"Microsoft YaHei",sans-serif}
#start h1{font-size:44px;letter-spacing:6px;margin:0 0 10px;font-weight:300}
#start p{opacity:.8;margin:4px}
#ctl{position:fixed;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.15);z-index:60;cursor:pointer}
#ctl i{display:block;height:100%;width:0;background:#7fd6ff}

.mi.dk{background:#cfcfcf;color:#666}
.mi.on,.mi.dk.on{background:linear-gradient(#f7b92e,#e6a014);color:#fff}
.mi.on i{background:#fff}
#hud,#menu,#brow,#rays,#wave,#fin{pointer-events:none}
#hud .ck,#menu .ck,#menu .mi,#menu .circ{pointer-events:auto;cursor:pointer}
.hexw{transition:transform .15s,filter .15s}.hexw.ck:hover{transform:scale(1.18);filter:drop-shadow(0 0 7px #8ff)}
.hexm.ck:hover{transform:scale(1.18)}
.sch.ck:hover{filter:brightness(1.35)}
.circ.ck:hover{transform:scale(1.15);opacity:1}
.fly{transition:opacity .3s,visibility .3s}
#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:15px;letter-spacing:2px;text-shadow:0 0 6px #08243a,0 0 2px #000;pointer-events:none;z-index:70;transition:opacity .3s;animation:pl 1.6s infinite ease-in-out}
@keyframes pl{50%{opacity:.55}}
#wrap{cursor:default}
#logoBox,#cursor,#brow,#fin{display:none!important}
/* ---- fullscreen stage / hd ---- */
#bg{position:fixed;left:0;top:0;width:calc(100*var(--vw));height:calc(100*var(--vh));object-fit:cover;will-change:filter,transform;z-index:0;image-rendering:auto}
.scr{position:fixed!important;left:0;top:0;width:calc(100*var(--vw))!important;height:calc(100*var(--vh))!important;pointer-events:none;z-index:1}
#wrap{z-index:2;overflow:visible!important;background:transparent!important}
#fsb{position:fixed;right:12px;top:10px;z-index:60;width:30px;height:30px;border:1.5px solid rgba(255,255,255,.75);border-radius:6px;color:#fff;background:rgba(10,30,50,.28);font-size:16px;line-height:27px;text-align:center;cursor:pointer;opacity:.55;transition:.2s;user-select:none}
#fsb:hover{opacity:1;background:rgba(10,30,50,.55);box-shadow:0 0 10px rgba(140,230,255,.7)}
/* ---- back button (menu) ---- */
.backbtn{height:26px;padding:0 12px 0 8px;border-radius:13px;border:2px solid #fff;box-sizing:border-box;color:#fff;font-size:12px;line-height:22px;background:rgba(10,30,50,.38);box-shadow:0 0 8px rgba(255,255,255,.45);white-space:nowrap;transition:background .15s,transform .15s,box-shadow .15s;text-shadow:0 0 3px #000}
.backbtn span{font-size:17px;line-height:20px;margin-right:4px;vertical-align:-1px}
.backbtn:hover{background:linear-gradient(#f7b92e,#e6a014);transform:translateX(3px);box-shadow:0 0 12px rgba(255,190,60,.9)}
.circ[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:34px;top:3px;white-space:nowrap;background:rgba(10,30,50,.88);color:#fff;font-size:11px;line-height:14px;padding:3px 8px;border-radius:3px;border:1px solid rgba(255,255,255,.5);pointer-events:none}
.hexw[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:44px;top:12px;white-space:nowrap;background:rgba(10,30,50,.88);color:#fff;font-size:11px;line-height:14px;padding:3px 8px;border-radius:3px;border:1px solid rgba(255,255,255,.5);pointer-events:none}
/* ---- gallery ---- */
#gal{position:fixed;inset:0;z-index:80;display:none;opacity:0;transition:opacity .35s;color:#fff;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
 background:radial-gradient(ellipse at 50% 0,rgba(40,90,140,.55),rgba(6,14,28,.9) 70%),rgba(6,14,28,.78);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1)}
#gal.on{opacity:1}
#gal .gh{position:absolute;left:0;right:0;top:0;height:74px;display:flex;align-items:center;gap:18px;padding:0 28px;box-sizing:border-box;z-index:3;
 background:linear-gradient(rgba(8,20,36,.92),rgba(8,20,36,.55) 75%,transparent)}
#gal .gback{height:34px;padding:0 16px 0 11px;border-radius:17px;border:2px solid #fff;background:rgba(10,30,50,.4);color:#fff;font-size:14px;cursor:pointer;box-shadow:0 0 8px rgba(255,255,255,.4);transition:.15s;font-family:inherit}
#gal .gback span{font-size:21px;line-height:18px;margin-right:5px;vertical-align:-2px}
#gal .gback:hover{background:linear-gradient(#f7b92e,#e6a014);box-shadow:0 0 14px rgba(255,190,60,.9);transform:translateX(3px)}
#gal .gt{font-size:24px;letter-spacing:4px;font-weight:600;text-shadow:0 0 12px rgba(120,200,255,.7)}
#gal .gt small{display:block;font:11px Bahnschrift,Arial,sans-serif;letter-spacing:5px;color:#9fd3f2;margin-top:1px;opacity:.85}
#gal .gc{margin-left:auto;font:14px Bahnschrift,Arial,sans-serif;color:#bfe3f7;letter-spacing:2px}
#gal .gq{width:200px;height:32px;border-radius:16px;border:1.5px solid rgba(255,255,255,.55);background:rgba(10,30,50,.45);color:#fff;padding:0 14px;outline:0;font:13px "Microsoft YaHei",sans-serif}
#gal .gq:focus{border-color:#7fe3f2;box-shadow:0 0 10px rgba(127,227,242,.6)}
#gal .gq::placeholder{color:#9cb8c8}
#gal .gscroll{position:absolute;inset:0;overflow-y:auto;padding:92px 34px 40px;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#6fb7da transparent}
#gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px 18px;max-width:1500px;margin:0 auto}
#gal .gcard{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;cursor:pointer;background:#0c1a2b;border:1.5px solid rgba(190,225,245,.45);box-shadow:0 6px 18px rgba(0,0,0,.45);
 transition:transform .22s,box-shadow .22s,border-color .22s;opacity:0;transform:translateY(16px);animation:gin .5s forwards}
@keyframes gin{to{opacity:1;transform:none}}
#gal .gcard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s,filter .3s;filter:saturate(1.05)}
#gal .gcard:hover{transform:translateY(-6px) scale(1.03);border-color:#fff;box-shadow:0 0 0 1px #7fe3f2,0 10px 28px rgba(0,0,0,.6),0 0 22px rgba(127,227,242,.65);z-index:2}
#gal .gcard:hover img{transform:scale(1.06);filter:saturate(1.15) brightness(1.05)}
#gal .gcard .gn{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 8px;font-size:14px;letter-spacing:1px;background:linear-gradient(transparent,rgba(4,12,24,.92));text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gal .gcard .gn b{font:700 11px Bahnschrift,Arial,sans-serif;color:#7fe3f2;margin-right:7px;letter-spacing:1px}
#gal .gcard::before{content:"";position:absolute;left:0;top:0;width:0;height:0;border-style:solid;border-width:22px 22px 0 0;border-color:#f7b92e transparent transparent;opacity:0;transition:.2s;z-index:2}
#gal .gcard:hover::before{opacity:1}
#gal .gnone{text-align:center;color:#9cb8c8;padding:80px 0;font-size:15px;display:none}
/* detail */
#gd{position:absolute;inset:0;z-index:5;display:none;opacity:0;transition:opacity .28s;background:rgba(3,8,16,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;gap:calc(5*var(--vw));padding:0 calc(5*var(--vw));box-sizing:border-box}
#gd.on{opacity:1}
#gd .gimg{height:calc(88*var(--vh));max-height:calc(calc(46*var(--vw))*1.5);aspect-ratio:2/3;max-width:calc(46*var(--vw));flex:none;border-radius:8px;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px #7fe3f2,0 0 40px rgba(127,227,242,.45),0 20px 60px rgba(0,0,0,.7);background:#0c1a2b;animation:gpop .35s}
@keyframes gpop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#gd .gimg img{width:100%;height:100%;object-fit:cover;display:block}
#gd .ginfo{width:min(360px,calc(34*var(--vw)));animation:gpop .45s}
#gd .gno{font:600 15px Bahnschrift,Arial,sans-serif;letter-spacing:6px;color:#7fe3f2}
#gd .gname{font-size:clamp(30px,calc(4.2*var(--vw)),56px);font-weight:700;letter-spacing:4px;margin:8px 0 12px;text-shadow:0 0 18px rgba(120,200,255,.7);line-height:1.15;word-break:break-all}
#gd .gline{height:3px;width:100%;background:linear-gradient(90deg,#f7b92e,rgba(247,185,46,0));margin:6px 0 16px}
#gd .gsub{font:13px Bahnschrift,"Microsoft YaHei",sans-serif;letter-spacing:3px;color:#b6d6e8;line-height:1.9}
#gd .gnav{margin-top:30px;display:flex;align-items:center;gap:12px}
#gd .gb{width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:rgba(10,30,50,.5);color:#fff;font-size:22px;cursor:pointer;line-height:36px;text-align:center;transition:.15s;user-select:none}
#gd .gb:hover{background:linear-gradient(#f7b92e,#e6a014);box-shadow:0 0 14px rgba(255,190,60,.9)}
#gd .gpos{font:14px Bahnschrift,Arial,sans-serif;color:#bfe3f7;letter-spacing:2px;min-width:70px;text-align:center}
#gd .gx{position:absolute;right:28px;top:22px;width:40px;height:40px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:22px;line-height:35px;text-align:center;cursor:pointer;background:rgba(10,30,50,.5);transition:.15s}
#gd .gx:hover{background:#d9505a;box-shadow:0 0 12px rgba(255,90,100,.8)}
@media (max-width:760px){#gd{flex-direction:column;gap:14px}#gd .gimg{height:calc(62*var(--vh));max-width:calc(90*var(--vw))}#gd .ginfo{width:calc(86*var(--vw));text-align:center}#gd .gnav{justify-content:center;margin-top:12px}#gal .gq{width:120px}#gal .gt{font-size:18px}}

/* ================= v3 extras ================= */
/* ---- ambient / global effects ---- */
#sheen{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.16) 50%,transparent 62%);background-size:260% 100%;animation:sheen 11s linear infinite;mix-blend-mode:soft-light}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,20,45,.38));animation:vig 7s ease-in-out infinite alternate}
@keyframes vig{from{opacity:.55}to{opacity:1}}
#scan{position:fixed;inset:0;z-index:190;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#flash{position:fixed;inset:0;z-index:210;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
.fill{position:relative;overflow:hidden}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.plate{overflow:hidden}
.plate::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);left:-50%;animation:pshine 5s ease-in-out infinite}
@keyframes pshine{0%,60%{left:-50%}100%{left:130%}}
.hexw>i{animation:hexg 2.6s ease-in-out infinite alternate}
.hexm>i{animation:hexg 3s ease-in-out infinite alternate}
@keyframes hexg{from{filter:brightness(.85)}to{filter:brightness(1.5) drop-shadow(0 0 4px #bff)}}
.circ.on{animation:cglow 1.8s ease-in-out infinite alternate}
@keyframes cglow{from{box-shadow:0 0 4px rgba(255,190,60,.6)}to{box-shadow:0 0 14px rgba(255,200,80,1)}}
.sch{transition:transform .15s,filter .15s}
.sch.ck:hover{transform:translateX(4px)}
.num{animation:numf 4.5s steps(1) infinite}
@keyframes numf{0%,92%,100%{opacity:1}94%{opacity:.7}96%{opacity:1}98%{opacity:.8}}
.mhit{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-shadow:0 0 4px #000;transition:transform .15s,background .15s;background:rgba(0,0,0,.04)}
.mhit:hover{transform:scale(1.18);background:rgba(127,227,242,.3);box-shadow:0 0 10px rgba(127,227,242,.9)}
.mhit::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(127,227,242,.0)}
.mhit.playing::after{border:2px dashed #7fe3f2;animation:spin 3s linear infinite}
.mhit.playing{animation:mbeat .6s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes mbeat{from{box-shadow:0 0 3px rgba(127,227,242,.4)}to{box-shadow:0 0 12px rgba(127,227,242,1)}}
.mhit[data-tip]:hover::before{content:attr(data-tip);position:absolute;left:100%;top:50%;margin:-10px 0 0 10px;white-space:nowrap;background:rgba(10,30,50,.9);color:#fff;font-size:11px;line-height:14px;padding:3px 8px;border-radius:3px;border:1px solid rgba(255,255,255,.5);pointer-events:none;z-index:9}
#toast{position:fixed;left:50%;bottom:60px;transform:translate(-50%,20px);z-index:300;background:rgba(8,20,36,.92);color:#fff;border:1.5px solid #7fe3f2;border-radius:18px;padding:9px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 0 14px rgba(127,227,242,.5);max-width:calc(90*var(--vw))}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- shared widgets ---- */
.rng{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:0;cursor:pointer;background:linear-gradient(90deg,#f7b92e var(--p,0%),rgba(255,255,255,.25) var(--p,0%));flex:1;min-width:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #f7b92e;box-shadow:0 0 8px rgba(247,185,46,.9)}
.rng::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #f7b92e}
.sbtn{height:34px;min-width:34px;padding:0 12px;border-radius:17px;border:2px solid #fff;background:rgba(10,30,50,.5);color:#fff;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:4px;user-select:none}
.sbtn:hover{background:linear-gradient(#f7b92e,#e6a014);box-shadow:0 0 12px rgba(255,190,60,.9)}
.sbtn.pri{background:linear-gradient(#f7b92e,#e6a014);border-color:#fff;box-shadow:0 0 10px rgba(255,190,60,.6)}
.sbtn.pri:hover{filter:brightness(1.12)}
.sbtn.sm{height:26px;min-width:26px;padding:0 9px;font-size:12px;border-width:1.5px;border-radius:13px}
.xbtn{position:absolute;right:16px;top:14px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:18px;line-height:30px;text-align:center;cursor:pointer;background:rgba(10,30,50,.5);transition:.15s;user-select:none;z-index:4}
.xbtn:hover{background:#d9505a;box-shadow:0 0 12px rgba(255,90,100,.8)}
.glass{background:linear-gradient(rgba(12,30,52,.92),rgba(6,16,30,.94));border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px #7fe3f2,0 0 40px rgba(127,227,242,.35),0 24px 70px rgba(0,0,0,.65);color:#fff;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.glass::before{content:"";position:absolute;left:0;top:0;border-style:solid;border-width:26px 26px 0 0;border-color:#f7b92e transparent transparent;pointer-events:none}

/* ---- anime player modal ---- */
#anm{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(30,80,130,.5),rgba(3,8,16,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .3s}
#anm.on{opacity:1}
#anm .awin{position:relative;width:min(980px,calc(94*var(--vw)),calc((calc(100*var(--vh)) - 200px)*1.7778));animation:gpop .4s}
#anm .ah{display:flex;align-items:baseline;gap:14px;padding:14px 64px 10px 24px}
#anm .at{font-size:20px;font-weight:700;letter-spacing:2px;text-shadow:0 0 12px rgba(120,200,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#anm .as{font:11px Bahnschrift,Arial,sans-serif;letter-spacing:3px;color:#7fe3f2;white-space:nowrap}
#anm .av{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#anm .av iframe,#anm .av #avp{position:absolute;inset:0;width:100%;height:100%;border:0}
#anm .aclick{position:absolute;inset:0;cursor:pointer;z-index:2}
#anm .aflash{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;background:rgba(10,30,50,.6);border:3px solid #fff;color:#fff;font-size:38px;line-height:78px;text-align:center;z-index:3;opacity:0;pointer-events:none}
#anm .aflash.go{animation:afl .55s ease-out}
@keyframes afl{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.4)}}

#cre .pbars div.b i{display:block;height:100%;width:100%;background:linear-gradient(#b6e84d,#6ea61a)}

﻿/* ================= mobile ================= */
/* NOTE: build4 rewrites every lowercase "<n>vw" / "<n>vh" below into calc(n * var(--vw|--vh)) so layouts follow the
   (possibly rotated) page size.  UPPERCASE VW / VH are left alone on purpose; real values are written by applyRot() into --vw/--vh/--RW/--RH (px). */
:root{--vw:1VW;--vh:1VH;--RW:100VW;--RH:100VH}
html.rot{background:#000}
html.rot,html.rot body{overflow:hidden}
html.rot body{position:fixed;left:0;top:0;width:var(--RH);height:var(--RW);transform-origin:0 0;transform:translateX(var(--RW)) rotate(90deg)}
html.mob,html.mob body{overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
html.mob body{touch-action:manipulation}
html:not(.mob) #mtb,html:not(.mob) #mgd,html:not(.mob) #mhelp,html:not(.mob) .mcg{display:none!important}
html.mob #fsb,html.mob #hint{display:none!important}

/* touch toolbar */
#mtb{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:150;display:flex;gap:4px;padding:4px 6px;border-radius:26px;background:rgba(6,18,34,.82);border:1px solid rgba(127,227,242,.75);box-shadow:0 0 16px rgba(127,227,242,.4),inset 0 0 12px rgba(127,227,242,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .25s,transform .25s;max-width:98%}
#mtb.hide{opacity:0;pointer-events:none;transform:translate(-50%,24px)}
#mtb button{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;width:46px;height:42px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;padding:0}
#mtb button b{font-size:19px;line-height:1;font-weight:400;text-shadow:0 0 8px rgba(127,227,242,.9)}
#mtb button i{font-style:normal;font-size:10px;letter-spacing:1px;color:#bfe9f5;line-height:1}
#mtb button:active{background:rgba(127,227,242,.3)}

/* guide pulse (also works on elements inside the scaled stage) */
.gd{animation:gdp 1s ease-in-out infinite alternate!important;z-index:60}
@keyframes gdp{from{box-shadow:0 0 0 5px rgba(255,212,90,.95),0 0 12px 6px rgba(255,212,90,.45);filter:brightness(1.1)}to{box-shadow:0 0 0 12px rgba(255,212,90,.55),0 0 30px 14px rgba(255,212,90,.85);filter:brightness(1.5)}}
#mtb button.gd{border-radius:14px;background:rgba(255,212,90,.22)}

/* guide card */
#mgd{position:fixed;left:50%;bottom:58px;transform:translate(-50%,16px);z-index:149;width:min(520px,calc(92*var(--vw)));box-sizing:border-box;padding:8px 12px 9px;border-radius:12px;background:rgba(6,18,34,.88);border:1px solid #ffd45a;box-shadow:0 0 18px rgba(255,212,90,.45);color:#fff;font:13px/1.55 'Microsoft YaHei','PingFang SC',sans-serif;opacity:0;pointer-events:none;transition:.25s}
#mgd.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#mgd.top{bottom:auto;top:8px}
#mgd.top.lft{left:8px;transform:none;width:min(300px,calc(46*var(--vw)))}
#mgd.top.rgt{left:auto;right:8px;transform:none;width:min(300px,calc(46*var(--vw)))}
#mgd.top #mgx{font-size:13px}
#mhelp.isl .hl{display:none}
#mgd .gh{display:flex;align-items:center;gap:8px;font-size:11px;color:#ffd45a;letter-spacing:2px}
#mgd .gh b{font-weight:700}
#mgd .gh span{color:#9fd3f2;letter-spacing:1px;flex:1}
#mgd .gh u{text-decoration:none;cursor:pointer;color:#fff;opacity:.7;padding:0 4px;font-size:13px}
#mgx{margin:2px 0 4px;font-size:14px}
#mgd .gb{display:flex;justify-content:flex-end}
#mgd .gb button{appearance:none;border:1px solid rgba(127,227,242,.7);background:rgba(127,227,242,.12);color:#cfefff;border-radius:12px;padding:2px 12px;font:11px 'Microsoft YaHei',sans-serif}

/* welcome / help sheet */
#mhelp{position:fixed;inset:0;z-index:260;display:none;align-items:center;justify-content:center;background:rgba(2,8,16,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#mhelp.on{display:flex}
#mhelp .hw{position:relative;width:min(560px,calc(94*var(--vw)));max-height:calc(94*var(--vh));overflow:auto;box-sizing:border-box;padding:12px 16px 12px;border-radius:14px;background:linear-gradient(160deg,rgba(14,34,58,.96),rgba(6,16,30,.96));border:1.5px solid #7fe3f2;box-shadow:0 0 30px rgba(127,227,242,.5);color:#fff;font-family:'Microsoft YaHei','PingFang SC',sans-serif;animation:gpop .35s}

#mhelp .hl{appearance:none;display:block;width:100%;margin:0 0 8px;padding:9px 0;border-radius:22px;border:1.5px solid #ffd45a;background:linear-gradient(180deg,rgba(255,212,90,.35),rgba(255,160,40,.2));color:#fff;font:700 16px 'Microsoft YaHei',sans-serif;letter-spacing:3px;animation:gdp 1s ease-in-out infinite alternate}
#mhelp .hg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#mhelp .hg button{appearance:none;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid rgba(127,227,242,.7);background:rgba(127,227,242,.1);color:#fff;font-family:'Microsoft YaHei',sans-serif}
#mhelp .hg b{display:block;font-size:14px;margin-bottom:2px}
#mhelp .hg small{display:block;font-size:11px;line-height:1.4;color:#9fd3f2}
#mhelp .hg button:active{background:rgba(127,227,242,.3)}
#mhelp .hs2{margin:8px 0 0;font-size:11px;line-height:1.7;color:#8fb2c6}
#mhelp .hs2 b{color:#fff;font-size:13px;margin-left:4px}

/* creator: step strip */
.mcg{display:none;flex-wrap:wrap;gap:4px 8px;padding:4px 14px;font:11.5px 'Microsoft YaHei',sans-serif;color:#ffe9a8;background:rgba(255,212,90,.08);border-bottom:1px solid rgba(255,212,90,.35)}
html.mob .mcg{display:flex}

/* phones: touch-friendly hit areas for the tiny circles on the stage */
html.mob .mhit{transform:scale(1.7)}
html.mob .mhit:hover{transform:scale(1.7)}
html.mob .sbtn,html.mob .chip,html.mob .mi2{min-height:34px}

/* small effective screens (phones, either orientation) */
html.sm #anm .awin{width:min(980px,calc(94*var(--vw)),calc((calc(100*var(--vh)) - 64px)*1.7778))}
html.sm #anm{align-items:center}

html.sm #mus .mh b{font-size:14px}
html.sm #mus .mv{aspect-ratio:auto;height:64px}
html.sm #mus .mcover{font-size:12px;letter-spacing:2px}
html.sm #mus .mnow{padding:5px 14px 0}
html.sm #mus .mt{font-size:14px}

html.sm #mus .ml{max-height:none;flex:none;overflow:visible}
html.sm #mus .mi2{padding:9px 14px}
html.mob.musopen #mtb{opacity:0;pointer-events:none;transform:translate(-50%,24px)}
html.sm #cre .cwin{width:calc(100*var(--vw));height:calc(100*var(--vh));border-radius:0}
html.sm #cre .cfoot .tip{display:none}

/* SAO CREATOR v1.3: saved settings, immutable initial allocation, aligned login. */
#sao-login-panel{grid-template-columns:64px minmax(0,1fr);grid-template-rows:46px 42px;gap:18px 16px;align-content:center;align-items:center;padding:24px;transform:scale(var(--sao-login-zoom,1));transform-origin:50% 50%;font-family:"Microsoft YaHei",sans-serif;box-shadow:0 8px 35px #102e4c4d}
#sao-login-panel>.login-label{position:static!important;display:flex;align-items:center;justify-content:flex-end;height:46px;font-size:18px;line-height:1.4;color:#3b5364;white-space:nowrap}
#sao-login-panel>.login-field{position:static!important;height:46px;min-width:0;box-sizing:border-box;border:2px solid #5c819c;border-radius:4px;background:#fff;display:flex;align-items:center;overflow:hidden}
#sao-login-panel #nick{width:100%;height:100%;min-width:0;box-sizing:border-box;margin:0;padding:0 10px;border:0;outline:0;background:transparent;font:18px/1.4 "Microsoft YaHei",sans-serif;color:#223848;text-align:left;letter-spacing:0}
#sao-login-panel>.login-submit{position:static!important;grid-column:1/-1;display:flex;align-items:center;justify-content:center;width:100%;height:42px;box-sizing:border-box;margin:0;padding:0 16px;border:1px solid #7e9fb7;border-radius:4px;background:linear-gradient(#fff,#dfeaf0);font:16px/1.4 "Microsoft YaHei",sans-serif;color:#294b62;cursor:pointer}
#sao-login-panel #nick:focus-visible{box-shadow:inset 0 0 0 2px #4a95e0}
#cre .urow{flex-wrap:wrap;align-items:stretch}
#cre .urow input[type=url]{flex:1 1 260px;min-width:0;height:38px;box-sizing:border-box;padding:0 10px;border:1px solid #8bb9d0;border-radius:5px;background:#0c2037;color:#fff;font:13px/1.5 "Microsoft YaHei",sans-serif}
#cre .urow button{min-height:38px}
#cre .attr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#cre .attr-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;padding:10px;border:1px solid #5e91b6;border-radius:5px;background:#0a1e328c;box-sizing:border-box}
#cre .attr-item span{font:13px/1.5 "Microsoft YaHei",sans-serif;white-space:nowrap}
#cre .attr-item small{display:block;color:#8fb2c6;font:10px/1.4 Bahnschrift,Arial,sans-serif;letter-spacing:1px}
#cre .attr-item input{width:58px;min-width:0;height:36px;box-sizing:border-box;border:1px solid #8bb9d0;border-radius:4px;background:#071726;color:#fff;padding:0 5px;font:16px/1.4 Bahnschrift,"Microsoft YaHei",sans-serif;text-align:center}
#cre .attr-item input:disabled{color:#ffe7aa;background:#243746;opacity:1;border-color:#ae9864;cursor:default}
#cre [data-c=saveattrs]{margin-top:12px;min-height:38px}
#cre [data-c=saveattrs]:disabled{opacity:1;cursor:default;color:#f5dfa1;border-color:#ae9864;background:#263a49}
#cre .saved-settings{margin-top:16px;padding:10px 12px;border:1px solid #5585a6;border-radius:5px;background:#071a2ac9;color:#dcebf4}
#cre .saved-settings summary{font:13px/1.6 "Microsoft YaHei",sans-serif;cursor:pointer;color:#9fe4f3}
#cre .saved-settings pre{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font:12px/1.8 "Microsoft YaHei",sans-serif;letter-spacing:0}
#cre .cres td{overflow-wrap:anywhere}
#cre .csec h4{flex-wrap:wrap;row-gap:3px}

function goHud(){scene='hud';hudT0=nowS();hudStage=0;hudStageAt=hudT0;leaveT=0}
function enterMenu(){if(scene!=='hud'||hudStage<3){tick(500,.08);return}scene='menu';menuT0=nowS();flyOpen=null;subOpen=false;leaveT=0;
  if(hudMusic&&AC){hudMusic.g.gain.linearRampToValueAtTime(0,AC.currentTime+.5);const h=hudMusic;setTimeout(()=>{try{h.s.stop()}catch(e){}},700)}playSeg(14.4,2.4)}
// menu -> hall: NO restart, the hall is shown in its finished state
function backToHall(){
  if(scene!=='menu')return;const n=nowS();
  scene='hud';hudT0=n-4;hudStage=3;hudStageAt=n-4;leaveT=n;flyOpen=null;subOpen=false;tick(700,.07);
  if(AC&&BUF){hudMusic=playSeg(7.4,0,0,true,14.6);if(hudMusic){hudMusic.g.gain.setValueAtTime(0,AC.currentTime);hudMusic.g.gain.linearRampToValueAtTime(1,AC.currentTime+.9)}}
}
function restart(){closeGallery(true);stopAudio();scene='desk';hudStage=0;menuT0=0;hudT0=0;flyOpen=null;subOpen=false;hudMusic=null;leaveT=0;bgB=0;
  [...menu.querySelectorAll('.mi')].forEach(m=>m.classList.remove('on'));fA.querySelector('.mi').classList.add('on');$('#cF').classList.add('on');$('#nick').value='Kirito'}
function galleryAllowed(){return (scene==='hud'&&hudStage===3)||scene==='menu'}
function act(name,elm){
  switch(name){
    case 'login1':if(hudStage===0){hudStage=1;hudStageAt=nowS();tick();setTimeout(()=>{const n=$('#nick');n&&n.focus()},450)}break;
    case 'login2':if(hudStage===1){hudStage=2;hudStageAt=nowS();tick(900,.12);document.activeElement&&document.activeElement.blur()}break;
    case 'menu':enterMenu();break;
    case 'back':backToHall();break;
    case 'gallery':if(galleryAllowed())openGallery();else tick(500,.08);break;
    case 'sideA':flyOpen=(flyOpen==='A'||flyOpen==='B')?null:'A';subOpen=false;tick();break;
    case 'sideC':flyOpen=flyOpen==='C'?null:'C';subOpen=false;tick();break;
    case 'item':if(+elm.dataset.i===2)flyOpen='B';tick();break;
    case 'fav':subOpen=!subOpen;tick();break;
    default:tick();
  }
}
function advance(){
  if(scene==='desk')return startIntro();
  if(scene==='hud'){if(hudStage===0)return act('login1');if(hudStage===1)return act('login2');if(hudStage===3)return enterMenu();return}
  if(scene==='menu'){
    if(!flyOpen)return act('sideA');
    if(flyOpen==='A')return act('item',{dataset:{i:2}});
    if(flyOpen==='B')return act('sideC');
    if(flyOpen==='C'){if(!subOpen)return act('fav');return act('gallery')}
  }
}
document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('#gal,#fsb'))return;
  if(scene==='desk'){startIntro(MX,MY);return}
  const a=e.target.closest&&e.target.closest('[data-act]');
  if(a)act(a.dataset.act,a);
  else if(scene==='menu'&&(flyOpen||subOpen)){flyOpen=null;subOpen=false}
});
addEventListener('mousemove',e=>{const p=PT(e);MX=(p[0]-OX)/SC;MY=(p[1]-OY)/SC});
addEventListener('keydown',e=>{
  const inp=e.target&&e.target.tagName==='INPUT';
  if(galOpen){
    if(e.key==='Escape'){e.preventDefault();if(dIdx>=0)closeDetail();else if(inp&&gq.value){gq.value='';filterGal()}else closeGallery();return}
    if(inp)return;
    if(dIdx>=0){if(e.key==='ArrowLeft'){e.preventDefault();navDetail(-1)}else if(e.key==='ArrowRight'){e.preventDefault();navDetail(1)}}
    return;
  }
  if(inp){if(e.key==='Enter'){e.preventDefault();act('login2')}return}
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();advance()}
  else if(e.key==='f'||e.key==='F')toggleFS();
  else if(e.key==='g'||e.key==='G'){if(galleryAllowed())openGallery()}
  else if(e.key==='Escape'||e.key==='Backspace'){if(scene==='menu'){e.preventDefault();backToHall()}}
  else if(e.key==='r'||e.key==='R')restart();
});

    a.addEventListener('loadedmetadata',()=>{a.playbackRate=this.rate});a.addEventListener('playing',()=>{if(a.playbackRate!==this.rate)a.playbackRate=this.rate;this._st(1)});a.addEventListener('pause',()=>{if(!a.ended)this._st(2)});

  setVolume(v){this.vol=v/100;this.a.volume=this.vol}
  setPlaybackRate(r){this.rate=r;this.a.playbackRate=r}
  loadVideoById(id){this.load(id)}
  getPlayerState(){return this.S}getCurrentTime(){return this.a.currentTime||0}getDuration(){const d=this.a.duration;return isFinite(d)?d:0}

 if(profile==='LEGACY'){toast('旧版云端存档码已失效（云端服务已停用），请用「复制角色设定」的全文重新建角');return false}
 if(!profile||!profile.attributes){toast('存档码无法解析，请确认是完整的 SAO1- 开头内容');return false}
 crSetBusy(true);
 try{
  crApplyProfile(profile);
  if(!CF.savedText)CF.savedText=crToText();
  crLocalWrite(crSnapshot());
  cre.classList.remove('done');crCloudStatus('存档已恢复，并写回本机。');crSync();toast('存档已恢复');return true;
 }catch(e){toast('恢复失败，存档码可能被截断');return false}

function crPicSet(src,pre,label,extra=[]){

 CF.pic={src:primary,pre:-1,label:'url',avatar:p?p.avatar:primary,sources,avatarSources:p?p.avatarSources:sources,choice:p?p.id:'custom-url',name:p?p.label:'自定义外链'};

function crUrl(onReady){
 const request=++crUrlRequest,raw=$('#curl').value.trim();if(!crPortraitUrl(raw)){toast('请输入公开HTTPS图片外链');return}
 const urls=[...new Set([...saoPublicSources(raw),...$('#cfallback').value.split(/\r?\n/).flatMap(saoPublicSources)])].filter(crPortraitUrl).slice(0,6);
 const current=()=>request===crUrlRequest;
 const attempt=index=>{if(!current())return;if(index>=urls.length){$('#portraitstatus').textContent='各条预览线路暂不可用，保存和创建仍不等待图片。';return}
  const image=new Image();image.referrerPolicy='no-referrer';let done=false;const timer=setTimeout(()=>{if(done)return;done=true;attempt(index+1)},3500);
  image.onload=()=>{if(done||!current())return;done=true;clearTimeout(timer);crPreviewSrc=urls[index];crSync();$('#portraitstatus').textContent='预览已载入；保存按钮会保存全部公开备用外链。';if(typeof onReady==='function')onReady()};
  image.onerror=()=>{if(done)return;done=true;clearTimeout(timer);attempt(index+1)};image.src=urls[index];};attempt(0);
}

    ROTW=false;try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
    if(inFS()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}

  if(innerWidth>innerHeight){toggleFS();setTimeout(refit,300);return}

    if(r){const p=r.call(d,{navigationUI:'hide'});if(p&&p.then)await p}
    if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape');ok=true}
  }catch(e){}
  if(!ok)ROTW=true;
  refit();setTimeout(refit,250);setTimeout(refit,800);mtUpd();
}

}
const tbn=k=>mtb.querySelector(`[data-t=${k}]`);
function rowsPV(){return [...parts.list.children].filter(r=>r.dataset.act==='anime').slice(0,4)}
function guideStep(){
  const sa=scene==='menu',hudOK=scene==='hud'&&hudStage===3,logged=hudOK||sa;
  if(scene==='desk')return{t:'先点一下屏幕任意位置，启动 SAO 开场动画。',g:[],n:'1'};
  if(scene==='intro')return null;
  if(scene==='hud'&&hudStage===0)return{t:'点弹窗里的「登录」按钮。',g:[parts.dlg.querySelector('#d1').lastElementChild],n:'2'};
  if(scene==='hud'&&hudStage===1)return{t:'输入你的昵称（会自动成为你的角色名），再点它下面的「登录」。',g:[parts.login.children[1],parts.login.children[2]],n:'3'};
  if(scene==='hud'&&hudStage===2)return null;
  if(!GOAL)return null;
  if(GOAL==='create'){
    if(MOD==='creator')return null;
    if(hudOK)return{t:'点屏幕顶部中间的 SAO 圆环（或底部 ☰ 菜单）打开菜单。',g:[parts.logo,tbn('menu')],n:'4'};
    if(sa&&!flyOpen)return{t:'点菜单左侧第一个圆形按钮（人形图标）。',g:[sb[0]],n:'5'};
    if(sa&&flyOpen==='A')return{t:'点列表第一项「创造角色」。',g:[fA.querySelector('.mi')],n:'6'};
    if(sa)return{t:'再点回左侧第一个圆形按钮。',g:[sb[0]],n:'5'};
  }
  if(GOAL==='music'){
    if(MU.open)return{t:'点列表里的歌就能播放；可拖进度条、调倍速和音量。点面板右上角 ✕ 关闭。',g:[],n:'✓'};
    if(logged)return{t:'点左上角两个小圆圈里上面那个（菜单里在右上方），或点底部 ♪ 按钮。',g:[(sa?mLeft:parts.icons).querySelector('.mhit'),tbn('music')],n:'4'};
  }
  if(GOAL==='pv'){
    if(hudOK)return{t:'点右侧动画列表里任意一行，就会弹出官方 PV 播放器。',g:rowsPV(),n:'4'};
    if(sa)return{t:'菜单里没有动画列表。点左上角「返回大厅」（或底部 ☰），再点右侧动画列表。',g:[mLeft.querySelector('.backbtn'),tbn('menu')],n:'4'};
  }
  if(GOAL==='gal'){
    if(logged)return{t:'点左侧第一个六边形（或底部 ▦ 图鉴按钮）。',g:[parts.hexes.querySelectorAll('.hexw')[0],tbn('gal')],n:'4'};
  }
  return null;
}
function mtUpd(){
  const modal=!!MOD||galOpen;
  mtb.classList.toggle('hide',modal);
  const lb=tbn('land');lb.querySelector('i').textContent=landOn()||inFS()?'竖屏':'横屏';lb.querySelector('b').textContent=landOn()||inFS()?'⟲':'⟳';
  const gs=guideStep();
  const want=!GOFF&&!modal&&!MU.open&&!mhp.classList.contains('on')&&gs;
  mgd.classList.toggle('on',!!want);
  if(want){$('#mgx').textContent=gs.t;$('#mgs').textContent=GOAL?GN[GOAL]:'';
    // keep the card away from the thing it points at
    const tg=gs.g.find(x=>x&&!mtb.contains(x));
    if(tg){const r=tg.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const ly=ROT?innerWidth-cx:cy,lx=ROT?cy:cx,H=VH(),W=VW();
      mgd.classList.toggle('top',ly>H*.42);
      mgd.classList.toggle('lft',ly>H*.42&&lx>W*.5);mgd.classList.toggle('rgt',ly>H*.42&&lx<=W*.5);
    }else{mgd.classList.remove('top','lft','rgt')}
  }
  mhp.classList.toggle('isl',landOn()||inFS());
  document.documentElement.classList.toggle('musopen',!!MU.open);
  const gl=[];
  if(!modal&&!mhp.classList.contains('on')&&!GOFF){
    if(gs)gl.push(...gs.g);
    if(MOB&&!landOn()&&!inFS()&&!landTapped)gl.push(tbn('land'));
  }
  if(MOD==='creator'&&!GOFF&&GOAL==='create')gl.push(cre.classList.contains('done')?cre.querySelector('[data-c=copy]'):cre.querySelector('.cfoot [data-c=make]'));
  setGlow(gl);
  // goal bookkeeping
  if(prevMOD==='creator'&&!MOD&&GOAL==='create'){GOAL=null;if(cre.classList.contains('done'))toast('角色设定已保存 ✓ 粘贴到聊天里发送即可')}
  if(prevMOD==='anime'&&!MOD&&GOAL==='pv')GOAL=null;
  if(prevMU&&!MU.open&&GOAL==='music')GOAL=null;
  if(prevGal&&!galOpen&&GOAL==='gal')GOAL=null;
  prevMOD=MOD;prevMU=!!MU.open;prevGal=!!galOpen;
}
setInterval(mtUpd,250);

function setGoal(g){GOAL=g;GOFF=false;mhp.classList.remove('on');mtUpd();
  if(!(scene==='hud'&&hudStage===3||scene==='menu')){/* guideStep already explains the pre-login steps */}}
function helpToggle(on){mhp.classList.toggle('on',on==null?!mhp.classList.contains('on'):on);mtUpd()}

mtb.addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('button');if(!b)return;const k=b.dataset.t;
  if(k==='land')landTapped=true;
  if(k==='land')goLand();
  else if(k==='help')helpToggle();
  else if(k==='menu'){
    if(scene==='menu')backToHall();
    else if(scene==='hud'&&hudStage===3)enterMenu();
    else toast(scene==='desk'?'先点一下屏幕启动 SAO':'先完成登录，再打开菜单');
  }
  else if(k==='creator'){if(galleryAllowed())openCreator();else toast('先点屏幕、完成「登录」，才能创建角色')}
  else if(k==='music'){
    if(!galleryAllowed()){toast('先点屏幕、完成「登录」，才能听主题曲');return}
    if(MU.open)closeMusic();else{openMusic();if(MU.i<0)mPlay(0)}}
  else if(k==='gal'){if(galleryAllowed())openGallery();else toast('先点屏幕、完成「登录」，才能看图鉴')}
  mtUpd();
});
mgd.addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('[data-g]');if(!b)return;
  if(b.dataset.g==='off'){GOFF=true;GOAL=null;mtUpd();toast('引导已关闭，点底部 ? 可再次打开')}
  else if(b.dataset.g==='goals'){helpToggle(true)}
});
mhp.addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('[data-h]');if(!b){return}
  const v=b.dataset.h;
  if(v==='x'){mhp.classList.remove('on');try{LS.set('sao_help1',1)}catch(_){}mtUpd()}
  else if(v==='land'){goLand()}
  else{try{LS.set('sao_help1',1)}catch(_){}setGoal(v)}
});
// first visit on a phone: show the welcome sheet
if(MOB&&!LS.get('sao_help1',0)){mhp.classList.add('on')}
mtUpd();

/* ---- frame ---- */
let lastHint='',raysDirty=false,waveDirty=false;
function frame(){
  const n=nowS();const dt=Math.min(.1,n-lastN);lastN=n;
  if(scene==='intro'&&n-sceneT0>=6.4)goHud();
  if(scene==='hud'&&hudStage===2&&n-hudStageAt>1.3){hudStage=3;hudStageAt=n}
  const inMenu=scene==='menu';
  const me=menuT0?n-menuT0:0;
  const lv=leaveT?n-leaveT:9;           // seconds since "back to hall"
  const leaving=lv<.5;
  // background blur follows the menu, eases back smoothly when returning to the hall
  bgB=inMenu?seg(me,0,.9):Math.max(0,bgB-dt*2.2);
  bgEl.style.filter=bgB>.01?`blur(${bgB*16*SC}px) brightness(${1-.42*bgB}) saturate(${1-.1*bgB})`:'none';
  bgEl.style.transform=bgXform(bgB);fxFrame(n,dt);
  // intro rays
  if(scene==='intro'){drawRays(1.0+(n-sceneT0));raysDirty=true}else if(raysDirty){cr.clearRect(0,0,1152,720);raysDirty=false}
  // HUD
  const hudShow=scene==='hud'||(inMenu&&me<.95);
  hud.style.display=hudShow?'block':'none';
  let WAv=0;
  if(hudShow){
    const he=n-hudT0, vt=7.4+he, se=n-hudStageAt;
    const out=inMenu?1-seg(me,0,.8):(leaveT?eo(seg(lv,.1,.55)):1);
    hud.style.opacity=out;hud.style.transform=`scale(${1+.04*(1-out)})`;hud.style.transformOrigin='576px 360px';
    const ap=(k,t0,d=.5)=>{const u=eo(seg(vt,t0,t0+d));parts[k].style.opacity=u;return u};
    let u;
    u=ap('topline',7.3,.6);parts.topline.style.transform=`translateY(${(1-u)*-30}px)`;
    u=ap('logo',7.35,.6);parts.logo.style.transform=`scale(${.6+.4*u}) rotate(${n*60}deg)`;
    u=ap('kirito',7.35,.5);parts.kirito.style.transform=`translateX(${(1-u)*-40}px)`;
    ap('clock',7.4);ap('hexes',7.45);ap('icons',7.5);ap('th1',7.5);
    ap('welcome',7.4,.6);if(hudStage>=3)parts.welcome.style.opacity*=1-seg(se,.4,1.0);
    ap('leafa',7.5);ap('cal',7.55);ap('weather',7.6);
    const tv=eo(seg(vt,7.5,8.0)), tl=7.4+(he%7.6);
    setThumb(parts.thL2,'L2',tl,tv);setThumb(parts.thL3,'L3',tl,tv);setThumb(parts.thL4,'L4',tl,tv);
    const dlgOn=hudStage===0||(hudStage===1&&se<.35);
    parts.dlg.style.display=dlgOn?'block':'none';
    parts.dlg.style.opacity=hudStage===0?eo(seg(vt,7.4,7.9)):1-seg(se,0,.3);
    const lgOn=hudStage===1||(hudStage===2&&se<.5);
    parts.login.style.display=lgOn?'grid':'none';
    parts.login.style.opacity=hudStage===1?eo(seg(se,.12,.5)):1-seg(se,0,.5);
    $('#loadtxt').style.opacity=hudStage<3?1:1-seg(se,0,.3);
    $('#loadtxt').textContent=hudStage===2?'正在获取动画列表...':(hudStage<2?'等待登录...':'已获取 22 项');
    parts.list.style.display=hudStage>=3?'block':'none';
    parts.list.style.opacity=hudStage>=3?eo(seg(se,0,.5)):0;
    parts.th1.style.boxShadow=`0 0 0 2px #3fe0d2,0 0 ${10+6*Math.sin(n*5)}px rgba(63,224,210,.8)`;
    WAv=eo(seg(he,0,.6))*out;
    WA=WAv;drawWave(7.4+(he%7.2));waveDirty=true;
  } else {WA=0;if(waveDirty){cw.clearRect(0,0,1152,720);waveDirty=false}}
  // MENU
  const menuShow=inMenu||leaving;
  menu.style.display=menuShow?'block':'none';
  if(menuShow){
    const mi=inMenu?eo(seg(me,.1,.9)):1-eo(seg(lv,0,.45));
    menu.style.opacity=mi;
    px+=((MX-576)/576-px)*.08;py+=((MY-360)/360-py)*.08;
    mg.style.transform=`perspective(1400px) rotateY(${px*2.4}deg) rotateX(${-py*1.5}deg) scale(${lerp(1.06,1,mi)})`;
    const tm=15.4+(me%9.6);
    ['MA','MB','MC','MD'].forEach(k=>setThumb(mth[k],k,tm,mi));
    drawRingClock(me+15);
    $('#cnt').textContent=(Math.floor(me)%2==0)?23:22;
    $('#hp2').textContent=(Math.floor(me/3)%2==0)?'705/ 750':'690/ 750';
    const vis=(f,on)=>{f.style.opacity=on?1:0;f.style.visibility=on?'visible':'hidden'};
    vis(fA,flyOpen==='A');vis(fB,flyOpen==='B');vis(fC,flyOpen==='C');
    $('#cSub').style.display=(flyOpen==='C'&&subOpen)?'block':'none';
    const ic=flyOpen==='C'?['📍','⚙','👤','👥','▥']:['👤','◍','☻','⚙','◉'];
    sb.forEach((s,i)=>{if(s.dataset.g!==ic[i]){s.dataset.g=ic[i];s.textContent=ic[i]}s.classList.toggle('on',(i===0&&(flyOpen==='A'||flyOpen==='B'))||(i===1&&flyOpen==='C'))});
    $('#fbl').style.transform=`translateY(${-lerp(0,28,eo(seg((n-menuT0)%3,.2,1.4)))*(flyOpen==='B'?1:0)}px)`;
  }
  // hint
  let h='';
  if(galOpen)h='';
  else if(scene==='desk')h='点击屏幕任意位置（或按空格）启动 SAO Utils　·　F 全屏';
  else if(scene==='hud'){h=hudStage===0?'点击弹窗里的「登录」（或按空格）':hudStage===1?'输入昵称，点击「登录」（空格 / 回车）':hudStage===2?'':'点击顶部的 SAO 圆环打开菜单（空格）　·　左上两个小圆圈（或按 M）：SAO 主题曲　·　右侧动画列表：点击看官方 PV　·　按 G：角色图鉴'}
  else if(scene==='menu'){h=!flyOpen?'点击左侧第一个圆形按钮（空格）　·　第 3 个按钮：角色图鉴　·　右上方两个小圆圈（M）：主题曲　·　左上角「返回大厅」':flyOpen==='A'?'点击 Equipment（或按空格）　·　第一项「创造角色」(C)：创建你的角色':flyOpen==='B'?'点击左侧第二个圆形按钮（或按空格）':!subOpen?'点击 Favorite（或按空格）':'点击「角色图鉴」（或按空格）'}
  if(h!==lastHint){lastHint=h;hint.textContent=h;hint.style.opacity=h?1:0}
  requestAnimationFrame(frame);
}
frame();
// pre-build + pre-decode the gallery in the background so it opens instantly with no blank cards
setTimeout(()=>{if(!galBuilt){galBuilt=true;buildGrid();ggrid.querySelectorAll('img').forEach(i=>{i.decode&&i.decode().catch(()=>{})})}},2500);
window.__dbg={act,advance,openGallery,closeGallery,backToHall,get state(){return{scene,hudStage,flyOpen,subOpen,galOpen}}};
</script>
